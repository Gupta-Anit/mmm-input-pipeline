name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python generate_exports.py --out raw && python mmm_inputs.py --raw raw --db mmm.duckdb && python mmm_inputs.py --raw raw --db mmm.duckdb
